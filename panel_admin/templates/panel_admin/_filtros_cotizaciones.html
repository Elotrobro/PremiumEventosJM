<form method="get" class="pa-filtros pa-card">

    <input type="hidden" name="por_pagina"
           value="{{ por_pagina|default:10 }}">

    {% if vista_actual %}
        <input type="hidden" name="vista" value="{{ vista_actual }}">
    {% endif %}

    <div>
        <label for="estadoSelect">Estado</label>

        <select name="estado" id="estadoSelect" class="form-control">
            <option value="">Todos</option>

            {% for valor, texto in estados %}
                <option value="{{ valor }}"
                    {% if estado == valor %}selected{% endif %}>
                    {{ texto }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="filtroSelect">Fecha de la cotización</label>

        <select name="filtro" id="filtroSelect"
                class="form-control"
                onchange="document.getElementById('rangoWrap').hidden = (this.value !== 'rango')">

            {% for valor, texto in filtros_fecha %}
                <option value="{{ valor }}"
                    {% if filtro == valor %}selected{% endif %}>
                    {{ texto }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div id="rangoWrap" class="pa-filtros-rango"
         {% if filtro != 'rango' %}hidden{% endif %}>

        <div>
            <label for="desdeInput">Fecha inicial</label>
            <input type="date" name="desde" id="desdeInput"
                   class="form-control" value="{{ desde }}">
        </div>

        <div>
            <label for="hastaInput">Fecha final</label>
            <input type="date" name="hasta" id="hastaInput"
                   class="form-control" value="{{ hasta }}">
        </div>
    </div>

    <div>
        <button type="submit" class="pa-btn">
            <i class="fas fa-filter"></i>
            Aplicar
        </button>

        {% if estado or filtro != 'siempre' or desde or hasta %}
            <a href="{{ request.path }}?por_pagina={{ por_pagina|default:10 }}{% if vista_actual %}&vista={{ vista_actual }}{% endif %}"
               class="pa-btn pa-btn-secondary">
                <i class="fas fa-xmark"></i>
                Limpiar
            </a>
        {% endif %}
    </div>

</form>
