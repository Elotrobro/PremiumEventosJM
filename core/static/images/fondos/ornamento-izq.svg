<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1200" viewBox="0 0 360 1200">
  <!-- Margen izquierdo (core/static/css/fondos.css): líneas finas y formas
       geométricas sobrias. Sin filtros ni degradados para que pese poco.
       Se repite hacia abajo; las dos líneas verticales empalman entre tiles. -->
  <g fill="none" stroke="#b8955a" stroke-width="1">
    <!-- Filete doble vertical -->
    <path d="M40 0V1200M47 0V1200" opacity=".28"/>

    <!-- Rombo doble -->
    <path d="M47 150L197 300L47 450" opacity=".3"/>
    <path d="M47 190L157 300L47 410" opacity=".18"/>

    <!-- Regla horizontal con remate -->
    <path d="M47 700H214" opacity=".3"/>
    <!-- Líneas escalonadas (estilo art déco) -->
    <path d="M47 880H197M47 892H157M47 904H117" opacity=".26"/>

    <!-- Marco de panel -->
    <rect x="84" y="990" width="118" height="170" opacity=".22"/>
  </g>

  <!-- Formas planas apenas sombreadas -->
  <path d="M47 230L117 300L47 370Z" fill="#3c2e23" opacity=".035"/>
  <rect x="74" y="980" width="118" height="170" fill="#3c2e23" opacity=".03"/>

  <!-- Remates en rombo -->
  <g fill="#b8955a" opacity=".45">
    <path d="M220 694l6 6-6 6-6-6z"/>
    <path d="M44 296l3.5 4-3.5 4-3.5-4z"/>
  </g>
</svg>
