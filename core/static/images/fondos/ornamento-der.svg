<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1200" viewBox="0 0 360 1200">
  <!-- Margen derecho (core/static/css/fondos.css): misma familia que el
       izquierdo, con otra composición para que no queden en espejo. -->
  <g fill="none" stroke="#b8955a" stroke-width="1">
    <!-- Filete doble vertical -->
    <path d="M313 0V1200M320 0V1200" opacity=".28"/>

    <!-- Marco de panel -->
    <rect x="158" y="120" width="118" height="170" opacity=".22"/>

    <!-- Regla horizontal con remate -->
    <path d="M146 420H313" opacity=".3"/>
    <!-- Líneas escalonadas -->
    <path d="M163 560H313M203 572H313M243 584H313" opacity=".26"/>

    <!-- Rombo doble -->
    <path d="M313 760L163 910L313 1060" opacity=".3"/>
    <path d="M313 800L203 910L313 1020" opacity=".18"/>
  </g>

  <!-- Formas planas apenas sombreadas -->
  <rect x="168" y="130" width="118" height="170" fill="#3c2e23" opacity=".03"/>
  <path d="M313 840L243 910L313 980Z" fill="#3c2e23" opacity=".035"/>

  <!-- Remates en rombo -->
  <g fill="#b8955a" opacity=".45">
    <path d="M140 414l6 6-6 6-6-6z"/>
    <path d="M316 906l3.5 4-3.5 4-3.5-4z"/>
  </g>
</svg>
