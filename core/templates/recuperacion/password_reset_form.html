{% extends 'base.html' %}
{% block content %}

<div class="login-container">
  <div class="login-card">
    <div class="login-title">
      <h2>Recuperar contraseña</h2>
      <p>Escribe el correo con el que te registraste y te enviaremos un enlace para crear una contraseña nueva.</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="recuperarEmail">Correo Electrónico</label>
        <input type="email" id="recuperarEmail" name="correo_electronico" placeholder="tu@email.com" required>
      </div>
      <button type="submit" class="btn-login">Enviar enlace</button>
    </form>

    <div class="back-home">
      <a href="{% url 'inicio' %}?login=1"><i class="fas fa-arrow-left"></i> Volver a iniciar sesión</a>
    </div>
  </div>
</div>

{% endblock %}
