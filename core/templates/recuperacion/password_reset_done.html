{% extends 'base.html' %}
{% block content %}

<div class="login-container">
  <div class="login-card">
    <div class="login-title">
      <h2>Revisa tu correo</h2>
      <p>Si el correo está registrado, te enviamos un enlace para restablecer tu contraseña.</p>
    </div>

    <div class="login-alert login-alert-success">
      El enlace vence en 1 hora. Si no lo ves, revisa también la carpeta de spam.
    </div>

    <div class="back-home">
      <a href="{% url 'inicio' %}"><i class="fas fa-house"></i> Volver al inicio</a>
    </div>
  </div>
</div>

{% endblock %}
